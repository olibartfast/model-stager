# NVIDIA Triton Inference Server
# (https://github.com/triton-inference-server/server) reading a repository built
# by the neutral stager. ONNX remains ONNX; no conversion backend or GPU is
# implied by this manifest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tritonserver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: tritonserver}
  template:
    metadata:
      labels: {app: tritonserver}
    spec:
      initContainers:
        - name: stage-artifacts
          image: your-registry/model-artifacts:latest
          volumeMounts:
            - {name: staging, mountPath: /staging}
        - name: model-stager
          image: your-registry/model-stager:latest
          env:
            - {name: STAGE_DIR, value: /staging}
            - {name: MODELS, value: "model-a,model-b"}
            - {name: MODEL_REPOSITORY, value: /model_repository}
            - {name: REPOSITORY_LAYOUT, value: triton}
          volumeMounts:
            - {name: staging, mountPath: /staging, readOnly: true}
            - {name: repository, mountPath: /model_repository}
      containers:
        - name: tritonserver
          image: nvcr.io/nvidia/tritonserver:25.12-py3
          args: [tritonserver, --model-repository=/model_repository]
          ports:
            - {name: http, containerPort: 8000}
            - {name: grpc, containerPort: 8001}
          volumeMounts:
            - {name: repository, mountPath: /model_repository, readOnly: true}
      volumes:
        - name: staging
          emptyDir: {}
        - name: repository
          persistentVolumeClaim:
            claimName: model-repository
