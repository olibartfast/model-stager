# Two inference servers, one stager, client-driven model loading.
#
# Triton serves the segmentation models, neuriplo-kserve-runtime serves the pose
# models, and both start with nothing loaded. The client decides what is resident
# at inference time through the KServe v2 model-repository extension.
#
#   Triton    rfdetr-seg, yolo26-seg      REPOSITORY_LAYOUT=triton
#   neuriplo  rfdetr-pose, yolo-pose      REPOSITORY_LAYOUT=neuriplo
#
# The same model-stager image builds both repositories. Only REPOSITORY_LAYOUT
# and the artifact image differ -- which is the point of the layout switch, since
# the two servers disagree about filenames while agreeing on the tree shape.
#
# PREREQUISITES
#
# 1. Time-slicing. Four GPU-holding containers across two pods on a one-GPU node
#    cannot schedule without it. Apply gpu-time-slicing.yaml FIRST, or the second
#    deployment sits Pending indefinitely.
#
# 2. TensorRT versions must match between each stager and the server that reads
#    its engines. Triton 25.12 and nvcr.io/nvidia/tensorrt:25.12-py3 both ship
#    TensorRT 10.14. A mismatch is not caught here: the engine builds fine and
#    the server rejects it at load time, which in explicit mode means the
#    client's first load call fails rather than anything failing at startup.
#
# 3. Artifact images carrying the ONNX exports, each staging itself into
#    /staging with its own CMD:
#      my-models:seg-v1    rfdetr-seg.onnx, yolo26-seg.onnx
#      my-models:pose-v1   rfdetr-pose.onnx, yolo-pose.onnx
#    The file basename becomes the served model name, so those names are what the
#    client will load.
#
# READINESS IN EXPLICIT MODE -- read before changing the probes
#
# neuriplo-kserve-runtime returns 503 from /v2/health/ready while no model is
# loaded (measured, not assumed). In explicit mode that is the normal startup
# state, so a readinessProbe on /v2/health/ready never passes, the Service gets
# no endpoints, and the client can never reach the server to load anything. The
# deployment deadlocks with a healthy process inside it.
#
# Both servers therefore gate readiness on /v2/health/live, which means "the
# control plane is up and accepting load requests". That is the only useful
# meaning of ready for a server whose contents are the client's choice.
#
# Triton with default --strict-readiness reports ready once the server is up and
# every loaded model is ready, which is vacuously true at zero models. Its probe
# is left on /v2/health/ready for that reason.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-seg-repo
  namespace: neuriplo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neuriplo-pose-repo
  namespace: neuriplo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# ---------------------------------------------------------------------------
# Triton: segmentation models, nothing loaded at startup.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tritonserver
  namespace: neuriplo
  labels:
    app: tritonserver
spec:
  replicas: 1
  # Cold engine builds run in the init container, before Triton starts. Measured
  # on an RTX 3060: ~8.5 min for a 101 MB model. The 600s default would mark the
  # rollout failed while the stager is still legitimately working.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tritonserver
  template:
    metadata:
      labels:
        app: tritonserver
    spec:
      runtimeClassName: nvidia
      initContainers:
        - name: stage-artifacts
          image: my-models:seg-v1
          imagePullPolicy: Never
          volumeMounts:
            - {name: staging, mountPath: /staging}

        - name: model-stager
          image: model-stager:trt
          imagePullPolicy: Never
          env:
            - {name: REPOSITORY_LAYOUT, value: triton}
            - {name: STAGE_DIR, value: /staging}
            - {name: MODEL_REPOSITORY, value: /models/repo}
            - {name: MODEL_VERSION, value: "1"}
            - {name: TRT_PRECISION, value: fp16}
            # Shape variables are per-model on purpose. Set them only for an
            # export with dynamic axes -- trtexec rejects explicit shapes on a
            # static model outright, so a global setting breaks the static one.
            # A dynamic model needs all three; a single TRT_SHAPES builds no
            # optimization profile and produces an engine that cannot accept the
            # range it was meant to serve.
            # - {name: TRT_MIN_SHAPES_RFDETR_SEG, value: "input:1x3x432x432"}
            # - {name: TRT_OPT_SHAPES_RFDETR_SEG, value: "input:1x3x432x432"}
            # - {name: TRT_MAX_SHAPES_RFDETR_SEG, value: "input:4x3x432x432"}
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: staging, mountPath: /staging}
            - {name: models, mountPath: /models}

      containers:
        - name: tritonserver
          image: nvcr.io/nvidia/tritonserver:25.12-py3
          args:
            - tritonserver
            - --model-repository=/models/repo
            # Nothing is loaded at startup. Without --load-model, explicit mode
            # leaves the repository catalogued but resident-free, and the client
            # owns what is in memory.
            - --model-control-mode=explicit
            - --http-port=8000
            - --grpc-port=8001
            - --metrics-port=8002
          ports:
            - {name: http, containerPort: 8000}
            - {name: grpc, containerPort: 8001}
            - {name: metrics, containerPort: 8002}
          startupProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 20
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}

      volumes:
        - name: staging
          emptyDir: {}
        - name: models
          persistentVolumeClaim:
            claimName: triton-seg-repo
---
apiVersion: v1
kind: Service
metadata:
  name: tritonserver
  namespace: neuriplo
spec:
  selector:
    app: tritonserver
  ports:
    - {name: http, port: 8000, targetPort: http}
    - {name: grpc, port: 8001, targetPort: grpc}
    - {name: metrics, port: 8002, targetPort: metrics}
---
# ---------------------------------------------------------------------------
# neuriplo-kserve-runtime: pose models, nothing loaded at startup.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuriplo-kserve-runtime
  namespace: neuriplo
  labels:
    app: neuriplo-kserve-runtime
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neuriplo-kserve-runtime
  template:
    metadata:
      labels:
        app: neuriplo-kserve-runtime
    spec:
      runtimeClassName: nvidia
      initContainers:
        - name: stage-artifacts
          image: my-models:pose-v1
          imagePullPolicy: Never
          volumeMounts:
            - {name: staging, mountPath: /staging}

        # Same image as Triton's stager. Only the layout differs, because the
        # two servers disagree on filenames inside an otherwise identical tree.
        - name: model-stager
          image: model-stager:trt
          imagePullPolicy: Never
          env:
            - {name: REPOSITORY_LAYOUT, value: neuriplo}
            - {name: STAGE_DIR, value: /staging}
            - {name: MODEL_REPOSITORY, value: /models/repo}
            - {name: MODEL_VERSION, value: "1"}
            - {name: TRT_PRECISION, value: fp16}
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: staging, mountPath: /staging}
            - {name: models, mountPath: /models}

      containers:
        - name: runtime
          image: neuriplo-kserve-runtime:trt-gpu
          imagePullPolicy: Never
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --models
            - /models/repo
            # Explicit mode requires --models. Nothing loads at startup, and a
            # model whose backend crashes on load cannot take the server down
            # before a client has asked for it.
            - --model-control-mode
            - explicit
            - --use-gpu
            - "true"
            - --instances
            - "1"
          ports:
            - {name: http, containerPort: 8080}
          # /v2/health/ready is 503 until a model is loaded, which is the normal
          # state here. Gating on it would leave the Service with no endpoints
          # and no way for a client to ever issue the load that would clear it.
          startupProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 20
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}

      volumes:
        - name: staging
          emptyDir: {}
        - name: models
          persistentVolumeClaim:
            claimName: neuriplo-pose-repo
---
apiVersion: v1
kind: Service
metadata:
  name: neuriplo-kserve-runtime
  namespace: neuriplo
spec:
  selector:
    app: neuriplo-kserve-runtime
  ports:
    - {name: http, port: 8080, targetPort: http}
