# OpenVINO Model Server
# (https://github.com/openvinotoolkit/model_server) reading the same neutral
# staging contract with its own filename capabilities selected by the layout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ovms}
  template:
    metadata:
      labels: {app: ovms}
    spec:
      initContainers:
        - name: stage-artifacts
          image: your-registry/model-artifacts:latest
          volumeMounts:
            - {name: staging, mountPath: /staging}
        - name: model-stager
          image: your-registry/model-stager:latest
          env:
            - {name: STAGE_DIR, value: /staging}
            - {name: MODELS, value: "model-a,model-b"}
            - {name: MODEL_REPOSITORY, value: /model_repository}
            - {name: REPOSITORY_LAYOUT, value: ovms}
          volumeMounts:
            - {name: staging, mountPath: /staging, readOnly: true}
            - {name: repository, mountPath: /model_repository}
      containers:
        - name: ovms
          image: openvino/model_server:latest
          args: [--model_repository_path=/model_repository, --port=9000]
          ports:
            - {name: grpc, containerPort: 9000}
          volumeMounts:
            - {name: repository, mountPath: /model_repository, readOnly: true}
      volumes:
        - name: staging
          emptyDir: {}
        - name: repository
          persistentVolumeClaim:
            claimName: model-repository
