# Experiment: Triton, staged repository, client-driven model loading.
#
# Model-agnostic. Nothing in this manifest's structure -- names, labels, probes,
# arguments, volumes, ports -- depends on which models are served. Two knobs, and
# only two, decide that:
#
#   the artifact image     which models exist
#   MODELS                 which of them this deployment stages
#
# Change either and nothing else here changes. Leave MODELS unset to stage
# everything the artifact image carries.
#
# Self-contained and isolated: its own namespace, PVC, Deployment and Service.
# Applying it cannot reconfigure anything outside exp-triton, and
# `kubectl delete ns exp-triton` removes it entirely.
#
# Created stopped (replicas: 0). Scale up to run, back to 0 when done. On a
# single-GPU node that means one experiment at a time unless you have configured
# GPU sharing yourself.
#
#   kubectl apply -f experiment-triton.yaml
#   kubectl -n exp-triton scale deploy/triton --replicas=1
#   kubectl -n exp-triton logs -f deploy/triton -c model-stager
#   ...
#   kubectl -n exp-triton scale deploy/triton --replicas=0
#
# The stager's TensorRT must match the server's: Triton 25.12 and
# nvcr.io/nvidia/tensorrt:25.12-py3 both ship TensorRT 10.14. A mismatch builds
# fine and fails at the client's first load call, not at startup.
apiVersion: v1
kind: Namespace
metadata:
  name: exp-triton
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-repo
  namespace: exp-triton
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: exp-triton
  labels:
    app: triton
spec:
  replicas: 0
  # A cold engine build takes minutes -- ~8.5 min for a 101 MB model on an RTX
  # 3060 -- and runs in the init container before Triton starts. The 600s default
  # would mark the rollout failed while the stager is still working.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      runtimeClassName: nvidia
      initContainers:
        # KNOB 1: which models exist. The image stages itself with its own CMD,
        # so this manifest describes no step and needs no command override.
        - name: stage-artifacts
          image: my-models:seg-v1
          imagePullPolicy: Never
          volumeMounts:
            - {name: staging, mountPath: /staging}

        - name: model-stager
          image: model-stager:trt
          imagePullPolicy: Never
          env:
            # KNOB 2: which of them this deployment serves. Unset stages all.
            - {name: MODELS, value: "rfdetr-seg,yolo26-seg"}
            - {name: REPOSITORY_LAYOUT, value: triton}
            - {name: STAGE_DIR, value: /staging}
            - {name: MODEL_REPOSITORY, value: /models/repo}
            - {name: MODEL_VERSION, value: "1"}
            - {name: TRT_PRECISION, value: fp16}
            # No shape variables. Set them only for an export with dynamic axes,
            # per model (TRT_MIN/OPT/MAX_SHAPES_<NAME>) -- trtexec rejects
            # explicit shapes on a static model outright, so a global setting
            # breaks every static model in the repository.
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: staging, mountPath: /staging}
            - {name: models, mountPath: /models}

      containers:
        - name: tritonserver
          image: nvcr.io/nvidia/tritonserver:25.12-py3
          args:
            - tritonserver
            - --model-repository=/models/repo
            # Without --load-model, explicit mode catalogues the repository and
            # loads none of it. What is resident is the client's decision -- and
            # it is why no model is named here either.
            - --model-control-mode=explicit
            - --http-port=8000
            - --grpc-port=8001
            - --metrics-port=8002
          ports:
            - {name: http, containerPort: 8000}
            - {name: grpc, containerPort: 8001}
            - {name: metrics, containerPort: 8002}
          # Triton with default --strict-readiness is ready once the server is up
          # and every loaded model is ready, vacuously true at zero models. That
          # is its documented behaviour rather than something measured here; if a
          # rollout hangs at readiness, move these to /v2/health/live.
          startupProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 20
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}

      volumes:
        - name: staging
          emptyDir: {}
        # Persisted so scaling to 0 and back does not rebuild the engines.
        - name: models
          persistentVolumeClaim:
            claimName: model-repo
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: exp-triton
spec:
  selector:
    app: triton
  ports:
    - {name: http, port: 8000, targetPort: http}
    - {name: grpc, port: 8001, targetPort: grpc}
    - {name: metrics, port: 8002, targetPort: metrics}
