# Experiment: neuriplo-kserve-runtime serving TensorRT pose models, loaded on
# demand.
#
# Self-contained and isolated. Its own namespace, its own PVC, its own names --
# it shares nothing with any other deployment and cannot reconfigure one. In
# particular it does not touch an existing neuriplo-kserve-runtime elsewhere in
# the cluster. Apply it, scale it, delete the namespace when finished.
#
#   models    rfdetr-pose, yolo-pose  (names come from the staged filenames)
#   layout    neuriplo
#   loading   explicit -- nothing resident until the client asks
#
# Created stopped (replicas: 0). Scale it up when you want to run it; scale it
# back to 0 when done. On a single-GPU node that means one experiment at a time
# unless you have configured GPU sharing yourself.
#
#   kubectl apply -f experiment-neuriplo-pose.yaml
#   kubectl -n exp-neuriplo-pose scale deploy/neuriplo-pose --replicas=1
#   kubectl -n exp-neuriplo-pose logs -f deploy/neuriplo-pose -c model-stager
#   ...
#   kubectl -n exp-neuriplo-pose scale deploy/neuriplo-pose --replicas=0
#
# Requires an artifact image staging rfdetr-pose.onnx and yolo-pose.onnx into
# /staging with its own CMD, and a model-stager image whose TensorRT version
# matches the runtime image's. A mismatch builds fine and fails at the client's
# first load call, not at startup.
apiVersion: v1
kind: Namespace
metadata:
  name: exp-neuriplo-pose
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-repo
  namespace: exp-neuriplo-pose
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuriplo-pose
  namespace: exp-neuriplo-pose
  labels:
    app: neuriplo-pose
spec:
  replicas: 0
  # A cold engine build takes minutes -- ~8.5 min for a 101 MB model on an RTX
  # 3060 -- and runs in the init container before the server starts. The 600s
  # default would mark the rollout failed while the stager is still working.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neuriplo-pose
  template:
    metadata:
      labels:
        app: neuriplo-pose
    spec:
      runtimeClassName: nvidia
      initContainers:
        - name: stage-artifacts
          image: my-models:pose-v1
          imagePullPolicy: Never
          volumeMounts:
            - {name: staging, mountPath: /staging}

        # Same image as the Triton experiment's stager. Only REPOSITORY_LAYOUT
        # differs, because the two servers disagree on filenames inside an
        # otherwise identical tree.
        - name: model-stager
          image: model-stager:trt
          imagePullPolicy: Never
          env:
            - {name: REPOSITORY_LAYOUT, value: neuriplo}
            - {name: STAGE_DIR, value: /staging}
            - {name: MODEL_REPOSITORY, value: /models/repo}
            - {name: MODEL_VERSION, value: "1"}
            - {name: TRT_PRECISION, value: fp16}
            # Set shape variables only for an export with dynamic axes -- trtexec
            # rejects explicit shapes on a static model outright. A dynamic model
            # needs all three: a single TRT_SHAPES builds no optimization
            # profile, producing an engine that cannot accept the range it was
            # meant to serve.
            # - {name: TRT_MIN_SHAPES_RFDETR_POSE, value: "input:1x3x432x432"}
            # - {name: TRT_OPT_SHAPES_RFDETR_POSE, value: "input:1x3x432x432"}
            # - {name: TRT_MAX_SHAPES_RFDETR_POSE, value: "input:4x3x432x432"}
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: staging, mountPath: /staging}
            - {name: models, mountPath: /models}

      containers:
        - name: runtime
          image: neuriplo-kserve-runtime:trt-gpu
          imagePullPolicy: Never
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --models
            - /models/repo
            # Explicit mode requires --models. Nothing loads at startup, and a
            # model whose backend crashes on load cannot take the server down
            # before a client has asked for it.
            - --model-control-mode
            - explicit
            - --use-gpu
            - "true"
            - --instances
            - "1"
          ports:
            - {name: http, containerPort: 8080}
          # Measured: /v2/health/ready returns 503 while no model is loaded,
          # which in explicit mode is the normal startup state. Gating readiness
          # on it would leave the Service with no endpoints and no way for a
          # client to ever issue the load that would clear it -- a healthy,
          # unreachable process. /v2/health/live means the control plane is up
          # and accepting load requests, which is the only useful sense of ready
          # for a server whose contents are the client's choice.
          startupProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 20
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}

      volumes:
        - name: staging
          emptyDir: {}
        # Persisted so scaling to 0 and back does not rebuild the engines.
        - name: models
          persistentVolumeClaim:
            claimName: model-repo
---
apiVersion: v1
kind: Service
metadata:
  name: neuriplo-pose
  namespace: exp-neuriplo-pose
spec:
  selector:
    app: neuriplo-pose
  ports:
    - {name: http, port: 8080, targetPort: http}
