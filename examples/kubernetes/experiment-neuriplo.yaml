# Experiment: neuriplo-kserve-runtime, staged repository, client-driven loading.
#
# Structurally identical to experiment-triton.yaml apart from the server
# container and REPOSITORY_LAYOUT, which is the point: the tree is the interface.
#
# Model-agnostic. Nothing in this manifest's structure -- names, labels, probes,
# arguments, volumes, ports -- depends on which models are served. Two knobs, and
# only two, decide that:
#
#   the artifact image     which models exist
#   MODELS                 which of them this deployment stages
#
# Change either and nothing else here changes. Leave MODELS unset to stage
# everything the artifact image carries.
#
# Self-contained and isolated: its own namespace, PVC, Deployment and Service. It
# does not touch a neuriplo-kserve-runtime deployed anywhere else in the cluster,
# and `kubectl delete ns exp-neuriplo` removes it entirely.
#
# Created stopped (replicas: 0). Scale up to run, back to 0 when done. On a
# single-GPU node that means one experiment at a time unless you have configured
# GPU sharing yourself.
#
#   kubectl apply -f experiment-neuriplo.yaml
#   kubectl -n exp-neuriplo scale deploy/neuriplo --replicas=1
#   kubectl -n exp-neuriplo logs -f deploy/neuriplo -c model-stager
#   ...
#   kubectl -n exp-neuriplo scale deploy/neuriplo --replicas=0
#
# The stager's TensorRT must match the runtime image's. A mismatch builds fine
# and fails at the client's first load call, not at startup.
apiVersion: v1
kind: Namespace
metadata:
  name: exp-neuriplo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-repo
  namespace: exp-neuriplo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuriplo
  namespace: exp-neuriplo
  labels:
    app: neuriplo
spec:
  replicas: 0
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neuriplo
  template:
    metadata:
      labels:
        app: neuriplo
    spec:
      runtimeClassName: nvidia
      initContainers:
        # KNOB 1: which models exist.
        - name: stage-artifacts
          image: my-models:pose-v1
          imagePullPolicy: Never
          volumeMounts:
            - {name: staging, mountPath: /staging}

        # Same stager image as the Triton experiment. Only REPOSITORY_LAYOUT
        # differs, because the two servers disagree on filenames inside an
        # otherwise identical tree.
        - name: model-stager
          image: model-stager:trt
          imagePullPolicy: Never
          env:
            # KNOB 2: which of them this deployment serves. Unset stages all.
            - {name: MODELS, value: "rfdetr-pose,yolo-pose"}
            - {name: REPOSITORY_LAYOUT, value: neuriplo}
            - {name: STAGE_DIR, value: /staging}
            - {name: MODEL_REPOSITORY, value: /models/repo}
            - {name: MODEL_VERSION, value: "1"}
            - {name: TRT_PRECISION, value: fp16}
            # No shape variables: see experiment-triton.yaml for why they are
            # per-model and why a global one breaks static exports.
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: staging, mountPath: /staging}
            - {name: models, mountPath: /models}

      containers:
        - name: runtime
          image: neuriplo-kserve-runtime:trt-gpu
          imagePullPolicy: Never
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --models
            - /models/repo
            # Explicit mode requires --models. Nothing loads at startup, and a
            # model whose backend crashes on load cannot take the server down
            # before a client has asked for it.
            - --model-control-mode
            - explicit
            - --use-gpu
            - "true"
            - --instances
            - "1"
          ports:
            - {name: http, containerPort: 8080}
          # Measured: /v2/health/ready returns 503 while no model is loaded,
          # which in explicit mode is the normal startup state. Gating readiness
          # on it would leave the Service with no endpoints and no way for a
          # client to ever issue the load that would clear it -- a healthy,
          # unreachable process. /v2/health/live means the control plane is up
          # and accepting load requests, the only useful sense of ready for a
          # server whose contents are the client's choice.
          startupProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 20
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}

      volumes:
        - name: staging
          emptyDir: {}
        - name: models
          persistentVolumeClaim:
            claimName: model-repo
---
apiVersion: v1
kind: Service
metadata:
  name: neuriplo
  namespace: exp-neuriplo
spec:
  selector:
    app: neuriplo
  ports:
    - {name: http, port: 8080, targetPort: http}
