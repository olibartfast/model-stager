# NVIDIA Triton Inference Server
# (https://github.com/triton-inference-server/server) with a neutral staging
# service. Replace the two example model names with the catalog selection.
services:
  stage-artifacts:
    image: your-registry/model-artifacts:latest
    volumes:
      - staging:/staging

  model-stager:
    image: your-registry/model-stager:latest
    depends_on:
      stage-artifacts:
        condition: service_completed_successfully
    environment:
      STAGE_DIR: /staging
      MODELS: model-a,model-b
      MODEL_REPOSITORY: /model_repository
      REPOSITORY_LAYOUT: triton
    volumes:
      - staging:/staging:ro
      - model-repository:/model_repository

  tritonserver:
    image: nvcr.io/nvidia/tritonserver:25.12-py3
    depends_on:
      model-stager:
        condition: service_completed_successfully
    command: [tritonserver, --model-repository=/model_repository]
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - model-repository:/model_repository:ro

volumes:
  staging:
  model-repository:
